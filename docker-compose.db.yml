services:
  database:
    image: postgres:16-alpine
    container_name: gymops_phase2_postgres
    environment:
      POSTGRES_USER: gymops
      POSTGRES_PASSWORD: gymops
      POSTGRES_DB: gymops
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymops -d gymops"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - gymops_phase2_postgres:/var/lib/postgresql/data

volumes:
  gymops_phase2_postgres:
